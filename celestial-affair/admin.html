<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guest Manager · Celestial Affair</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:1000px;margin:32px auto;padding:25px}.admin input{padding:12px;background:#090f19;color:white;border:1px solid #a88a58;max-width:100%}.admin .controls{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.admin table{width:100%;border-collapse:collapse;font:13px Arial,sans-serif}.admin td,.admin th{border-bottom:1px solid #ffffff23;text-align:left;padding:10px;vertical-align:top}.admin button{padding:8px;margin:3px;background:#c7a86a;border:0;color:#121827}.admin .scroll{overflow-x:auto}.admin code{font-size:12px}.admin p{line-height:1.6}</style></head><body><div class="admin"><h1>Celestial Guest Manager</h1><p>Private management tool. Keep your admin token secret. For a stronger production setup, host this page separately behind authentication. This file does not store your token.</p><div class="controls"><label>Worker URL <input id="endpoint" placeholder="https://...workers.dev" size="42"></label><label>Admin token <input id="secret" type="password" placeholder="Secret" size="28"></label><button id="load">Load guest list</button></div><h2>Add a guest</h2><form id="create"><div class="controls"><input id="name" placeholder="Guest name" required maxlength="120"><input id="email" type="email" placeholder="Email (optional)"><button type="submit">Create personalized link</button></div></form><p id="message" role="status"></p><div class="scroll"><table><thead><tr><th>Guest</th><th>Status</th><th>Visits</th><th>Dish / note</th><th>Invitation</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
const el=id=>document.getElementById(id);const guestBase=location.href.replace(/admin\.html.*$/,'index.html');
async function request(path,method='GET',value){const base=el('endpoint').value.replace(/\/$/,'');if(!base||!el('secret').value)throw Error('Enter your Worker URL and admin token');const response=await fetch(base+path,{method,headers:{'Authorization':'Bearer '+el('secret').value,'Content-Type':'application/json'},body:value?JSON.stringify(value):undefined});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
function cell(tr,text){const td=document.createElement('td');td.textContent=text==null?'':String(text);tr.appendChild(td);return td}
async function load(){try{const data=await request('/admin/guests');el('rows').replaceChildren();for(const guest of data.guests){const tr=document.createElement('tr');cell(tr,guest.name+'\n'+guest.email);cell(tr,guest.revoked?'Revoked':(guest.status||'Awaiting RSVP')+(guest.party_size?' ('+guest.party_size+')':''));cell(tr,String(guest.visits||0)+(guest.first_visit?' · first '+guest.first_visit:''));cell(tr,[guest.dish,guest.note].filter(Boolean).join(' / '));const url=guestBase+'?invite='+guest.token;const link=document.createElement('td'),a=document.createElement('a');a.textContent='Open';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.style.color='#e6cd9c';link.append(a);tr.append(link);const controls=document.createElement('td');const copy=document.createElement('button');copy.textContent='Copy link';copy.onclick=()=>navigator.clipboard.writeText(url);controls.append(copy);if(guest.email){const mail=document.createElement('button');mail.textContent='Draft email';mail.onclick=()=>{const subject=encodeURIComponent('You are invited · A Celestial Affair');const body=encodeURIComponent(`Hello ${guest.name},\n\nYou are invited to A Celestial Affair on December 31 at 7:00 PM.\n\nYour personalized invitation: ${url}\n\nCelestial Cocktail attire. Please bring a celestial inspired dish or drink to share.\n\nFor planning, personalized invitation links record visits and RSVP responses.\n\nHope to see you there!`);location.href=`mailto:${encodeURIComponent(guest.email)}?subject=${subject}&body=${body}`};controls.append(mail)}const sent=document.createElement('button');sent.textContent=guest.sent_at?'Sent ✓':'Mark sent';sent.disabled=Boolean(guest.sent_at);sent.onclick=async()=>{await request('/admin/guests/'+guest.id+'/sent','POST');await load()};controls.append(sent);if(!guest.revoked){const revoke=document.createElement('button');revoke.textContent='Revoke';revoke.onclick=async()=>{if(confirm('Revoke this invite?')){await request('/admin/guests/'+guest.id+'/revoke','POST');await load()}};controls.append(revoke)}tr.append(controls);el('rows').append(tr)}el('message').textContent=data.guests.length+' guest records loaded'}catch(e){el('message').textContent=e.message}}
el('load').onclick=load;el('create').onsubmit=async e=>{e.preventDefault();try{const created=await request('/admin/guests','POST',{name:el('name').value,email:el('email').value});el('message').textContent='Created '+created.name+'. Link shown in the list.';el('name').value='';el('email').value='';await load()}catch(err){el('message').textContent=err.message}};
</script></body></html>
